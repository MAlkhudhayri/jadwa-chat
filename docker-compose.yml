version: "3.8"

services:
  # ─── Qdrant Vector Database ───────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: jadwachat-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped

  # ─── Backend API ──────────────────────────────────
  backend:
    build: ./backend
    container_name: jadwachat-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      - qdrant
    volumes:
      - backend_data:/app/data
    restart: unless-stopped

  # ─── Frontend ─────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: jadwachat-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  qdrant_data:
  backend_data:
