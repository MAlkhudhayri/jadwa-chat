series:
  # ─── Oil / Macro ────────────────────────────────────
  - series_id: ksa_crude_production
    name: KSA Crude Oil Production
    domain: oil
    source: JODI
    unit: mn bbl/day
    frequency: monthly
    source_url: http://www.jodidb.org/TableViewer/tableView.aspx?ReportId=93904
    description: Saudi Arabia crude oil production volumes
    synonyms: ["saudi oil production", "ksa production", "saudi crude"]

  - series_id: ksa_oil_exports
    name: KSA Oil Export Volumes
    domain: oil
    source: JODI
    unit: mn bbl/day
    frequency: monthly
    source_url: http://www.jodidb.org/TableViewer/tableView.aspx?ReportId=93904
    description: Saudi Arabia oil export volumes
    synonyms: ["saudi exports", "ksa exports", "oil exports"]

  - series_id: global_oil_demand
    name: Global Oil Demand
    domain: oil
    source: EIA
    unit: mn bbl/day
    frequency: monthly
    source_url: https://www.eia.gov/outlooks/steo/data/browser/
    description: World total oil consumption/demand
    synonyms: ["world oil demand", "global demand", "oil consumption"]

  - series_id: global_oil_supply
    name: Global Oil Supply
    domain: oil
    source: EIA
    unit: mn bbl/day
    frequency: monthly
    source_url: https://www.eia.gov/outlooks/steo/data/browser/
    description: World total oil production/supply
    synonyms: ["world oil supply", "global supply", "world production"]

  - series_id: brent_price
    name: Brent Crude Price
    domain: oil
    source: EIA
    unit: USD/bbl
    frequency: monthly
    source_url: https://www.eia.gov/outlooks/steo/data/browser/
    description: Brent crude oil spot price
    synonyms: ["brent", "oil price", "crude price", "brent crude"]

  # ─── Balance of Payments ────────────────────────────
  - series_id: current_account
    name: Current Account
    domain: bop
    source: SAMA
    unit: SAR bn
    frequency: monthly
    source_url: https://www.sama.gov.sa/en-US/EconomicReports/pages/monthlystatistics.aspx
    description: Saudi Arabia current account balance
    synonyms: ["current account balance", "CA"]

  - series_id: net_services
    name: Net Services
    domain: bop
    source: SAMA
    unit: SAR bn
    frequency: monthly
    source_url: https://www.sama.gov.sa/en-US/EconomicReports/pages/monthlystatistics.aspx
    description: Net services balance
    synonyms: ["services balance", "net services trade"]

  - series_id: net_change_reserves
    name: Net Change in Reserves
    domain: bop
    source: SAMA
    unit: SAR bn
    frequency: monthly
    source_url: https://www.sama.gov.sa/en-US/EconomicReports/pages/monthlystatistics.aspx
    description: Net change in foreign reserves
    synonyms: ["reserve change", "reserves change"]

  # ─── Fiscal Environment ─────────────────────────────
  - series_id: govt_revenues
    name: Government Revenues
    domain: fiscal
    source: MoF
    unit: SAR bn
    frequency: monthly
    source_url: https://www.mof.gov.sa/en/financialreport/Pages/default.aspx
    description: Saudi government total revenues
    synonyms: ["revenues", "government income", "fiscal revenue"]

  - series_id: govt_expenditure
    name: Government Expenditure
    domain: fiscal
    source: MoF
    unit: SAR bn
    frequency: monthly
    source_url: https://www.mof.gov.sa/en/financialreport/Pages/default.aspx
    description: Saudi government total expenditure
    synonyms: ["spending", "government spending", "fiscal spending"]

  - series_id: govt_debt
    name: Government Debt
    domain: fiscal
    source: NDMC
    unit: SAR bn
    frequency: monthly
    source_url: https://ndmc.gov.sa/en/stats/Pages/default.aspx
    description: Saudi government total debt
    synonyms: ["public debt", "sovereign debt"]

  - series_id: debt_to_gdp
    name: Debt to GDP Ratio
    domain: fiscal
    source: NDMC
    unit: "%"
    frequency: monthly
    source_url: https://ndmc.gov.sa/en/stats/Pages/default.aspx
    description: Government debt as percentage of GDP
    synonyms: ["debt ratio", "debt/gdp"]

  - series_id: gdp_growth
    name: GDP Growth
    domain: fiscal
    source: NDMC
    unit: "% YoY"
    frequency: monthly
    source_url: https://www.sama.gov.sa/en-US/EconomicReports/pages/monthlystatistics.aspx
    description: Saudi Arabia GDP growth rate year-over-year
    synonyms: ["economic growth", "gdp"]

  # ─── Financial Stability ────────────────────────────
  - series_id: sama_reserves
    name: SAMA Reserves
    domain: stability
    source: SAMA
    unit: SAR bn
    frequency: monthly
    source_url: https://www.sama.gov.sa/en-US/EconomicReports/pages/monthlystatistics.aspx
    description: SAMA foreign exchange reserves
    synonyms: ["central bank reserves", "fx reserves"]

  - series_id: nfa_banks
    name: "Net Foreign Assets \u2014 Banks"
    domain: stability
    source: SAMA
    unit: SAR bn
    frequency: monthly
    source_url: https://www.sama.gov.sa/en-US/EconomicReports/pages/monthlystatistics.aspx
    description: Net foreign assets held by commercial banks
    synonyms: ["bank foreign assets", "nfa"]

  - series_id: govt_deposits_sama
    name: "Government & Quasi-Govt Deposits at SAMA"
    domain: stability
    source: SAMA
    unit: SAR bn
    frequency: monthly
    source_url: https://www.sama.gov.sa/en-US/EconomicReports/pages/monthlystatistics.aspx
    description: Government and quasi-government deposits at SAMA
    synonyms: ["govt deposits", "government deposits"]

  - series_id: reserve_m3_ratio
    name: Reserve / M3 Ratio
    domain: stability
    source: SAMA
    unit: "%"
    frequency: monthly
    source_url: https://www.sama.gov.sa/en-US/EconomicReports/pages/monthlystatistics.aspx
    description: Foreign reserves as percentage of M3 money supply
    synonyms: ["reserve ratio", "reserves to m3"]

  - series_id: money_supply_m3
    name: Money Supply (M3)
    domain: stability
    source: SAMA
    unit: SAR bn
    frequency: monthly
    source_url: https://www.sama.gov.sa/en-US/EconomicReports/pages/monthlystatistics.aspx
    description: Broad money supply M3
    synonyms: ["m3", "money supply", "broad money"]

  - series_id: saibor_sofr_3m_spread
    name: 3-Month SAIBOR-SOFR Spread
    domain: stability
    source: SAMA
    unit: bps
    frequency: monthly
    source_url: https://www.sama.gov.sa/en-US/EconomicReports/pages/monthlystatistics.aspx
    description: Spread between 3-month SAIBOR and SOFR
    synonyms: ["3m spread", "saibor spread", "interbank spread"]

  - series_id: saibor_sofr_12m_spread
    name: 12-Month SAIBOR-SOFR Spread
    domain: stability
    source: SAMA
    unit: bps
    frequency: monthly
    source_url: https://www.sama.gov.sa/en-US/EconomicReports/pages/monthlystatistics.aspx
    description: Spread between 12-month SAIBOR and SOFR
    synonyms: ["12m spread", "saibor 12m"]

  # ─── Banking Sector ─────────────────────────────────
  - series_id: capital_adequacy_ratio
    name: Capital Adequacy Ratio
    domain: banking
    source: SAMA
    unit: "%"
    frequency: monthly
    source_url: https://www.sama.gov.sa/en-US/EconomicReports/pages/monthlystatistics.aspx
    description: Banking sector capital adequacy ratio
    synonyms: ["car", "capital ratio"]

  - series_id: simple_ldr
    name: Simple Loan-to-Deposit Ratio
    domain: banking
    source: SAMA
    unit: "%"
    frequency: monthly
    source_url: https://www.sama.gov.sa/en-US/EconomicReports/pages/monthlystatistics.aspx
    description: Loans as percentage of deposits
    synonyms: ["ldr", "loan deposit ratio"]

  - series_id: demand_deposits_pct
    name: "Demand Deposits (% of Total)"
    domain: banking
    source: SAMA
    unit: "%"
    frequency: monthly
    source_url: https://www.sama.gov.sa/en-US/EconomicReports/pages/monthlystatistics.aspx
    description: Demand deposits as percentage of total deposits
    synonyms: ["demand deposits share"]

  - series_id: commercial_bank_deposits
    name: Commercial Bank Deposits
    domain: banking
    source: SAMA
    unit: SAR bn
    frequency: monthly
    source_url: https://www.sama.gov.sa/en-US/EconomicReports/pages/monthlystatistics.aspx
    description: Total commercial bank deposits
    synonyms: ["bank deposits", "deposits"]

  - series_id: commercial_bank_loans
    name: Commercial Bank Loans
    domain: banking
    source: SAMA
    unit: SAR bn
    frequency: monthly
    source_url: https://www.sama.gov.sa/en-US/EconomicReports/pages/monthlystatistics.aspx
    description: Total commercial bank loans
    synonyms: ["bank loans", "credit", "lending"]

  - series_id: banking_roe
    name: Banking Sector ROE
    domain: banking
    source: SAMA
    unit: "%"
    frequency: monthly
    source_url: https://www.sama.gov.sa/en-US/EconomicReports/pages/monthlystatistics.aspx
    description: Banking sector return on equity
    synonyms: ["roe", "return on equity", "bank profitability"]

  - series_id: npl_ratio
    name: Non-Performing Loans Ratio
    domain: banking
    source: SAMA
    unit: "%"
    frequency: monthly
    source_url: https://www.sama.gov.sa/en-US/EconomicReports/pages/monthlystatistics.aspx
    description: Non-performing loans net of provisions as percentage of gross loans
    synonyms: ["npl", "bad loans", "npls"]

